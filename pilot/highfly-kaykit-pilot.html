<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HIGHFLY — Laboratorio KayKit v7</title>
  <style>
    :root{font-family:Inter,system-ui,Arial,sans-serif;background:#060a15;color:#e9f1ff}
    *{box-sizing:border-box}
    body{margin:0;overflow:hidden}
    #stage{position:fixed;inset:0}
    #bar{position:absolute;z-index:1;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:linear-gradient(#050916ef,#08132544);pointer-events:none}
    .brand{font-size:23px;font-weight:900;letter-spacing:3px;color:#73deff;text-shadow:0 0 18px #1b6ddd}
    .sub{color:#8da5c9;font-size:11px;letter-spacing:2px}
    #controls{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 22px 24px;display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(transparent,#060b18ed);pointer-events:none}
    .panel{pointer-events:auto;background:#091528d9;border:1px solid #316189aa;box-shadow:0 0 34px #02142999;border-radius:12px;padding:13px 16px;max-width:min(95vw,700px)}
    .label{display:block;color:#96bbda;font-size:12px;margin-bottom:7px}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    button,select{background:#0d2242;color:#e4f4ff;border:1px solid #3d779e;border-radius:8px;padding:9px 13px;cursor:pointer;font:inherit}
    button[aria-pressed=true]{background:#165287;box-shadow:0 0 11px #228dd366}
    button:hover{border-color:#74dfff}
    #status{margin-top:9px;color:#96bee0;font-size:12px;max-width:530px;overflow-wrap:anywhere}
    #notice{font-size:11px;line-height:1.4;color:#b1bfd0;max-width:300px}
    @media(max-width:650px){.brand{font-size:18px}#controls{bottom:0;padding:8px 10px}.panel{padding:9px}.buttons button{padding:8px 10px}#notice{display:none}}
  </style>
</head>
<body>
  <div id="stage" aria-label="Visor 3D privado de modelos KayKit"></div>
  <div id="bar"><div><div class="brand">HIGHFLY <span style="color:#f5f8ff">ORIGIN</span></div><div class="sub">KAYKIT V7 · PRIVATE MODEL LAB · BASE v0.44.7</div></div><div class="sub">3D / RIG TEST</div></div>
  <div id="controls">
    <div class="panel">
      <span class="label">PERSONAJE · Arrastrá para rotar / rueda para zoom</span>
      <div class="buttons">
        <button type="button" id="hero" aria-pressed="true">Cazador KayKit</button>
        <button type="button" id="skeleton" aria-pressed="false">Esqueleto KayKit</button>
        <select id="clips" aria-label="Animación"><option>Sin animación</option></select>
        <button type="button" id="reset">Restablecer cámara</button>
      </div>
      <div id="status" role="status">Preparando modelos de prueba...</div>
    </div>
    <div id="notice">Prueba privada de modelos de KayKit Complete del propietario. No reemplaza el RPG, no concede derechos de publicación ni modifica partidas.</div>
  </div>
  <script type="module" src="/src/highfly_kaykit_pilot.ts"></script>
</body>
</html>
