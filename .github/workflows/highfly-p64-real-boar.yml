name: HIGHFLY P64 Actual CC0 Boar
on:
  push:
    branches: [highfly-origin-commercial-p0]
    paths:
      - scripts/highfly_p64_real_boar_cc0.py
      - tests/test_highfly_p64_real_boar_cc0.py
      - .github/workflows/highfly-p64-real-boar.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license-and-glb-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/highfly_p64_real_boar_cc0.py
      - run: python -m unittest discover -s tests -p 'test_highfly_p64_real_boar_cc0.py' -v
