name: HIGHFLY 0.45.4 — Pages offline CC0-only trial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pages_*.mjs'
      - 'config/pages_v0454_media_allowlist.json'
      - '.github/workflows/pages-v0454-trial.yml'

permissions:
  contents: read

concurrency:
  group: highfly-0454-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MIT engine with only 16 pinned CC0 media (no redistribution of WOC-owned art)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout HIGHFLY audit and filters
        uses: actions/checkout@v4
        with:
          path: highfly
          persist-credentials: false

      - name: Checkout EXACT ClaudeCraft 0.45.4 source (sparse — skip gigs of screenshots/art)
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: ebd3aa444352952321e0108b335722fe26d35716
          path: upstream
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /server/
            /data/
            /third_party/
            /patches/
            /build/
            /headless/
            /mediawiki/
            /electron/
            /docs/i18n/
            /public/models/chars/players/knight.glb
            /public/models/chars/players/ranger.glb
            /public/models/chars/enemies/skeleton_warrior.glb
            /public/models/foliage/oak_1.glb
            /public/models/foliage/pine_1.glb
            /public/models/foliage/rock_1.glb
            /public/models/foliage/bush.glb
            /public/models/foliage/fern.glb
            /public/textures/terrain/Grass001_Color.jpg
            /public/textures/terrain/Ground071_Color.jpg
            /public/textures/terrain/Rock026_Color.jpg
            /public/textures/terrain/PavingStones046_Color.jpg
            /public/models/creatures/wild_boar.glb
            /public/models/biome/hex_ship_blue.glb
            /public/models/biome/hex_ship_green.glb
            /public/models/biome/hex_ship_red.glb

      - name: Verify pinned version and remove unapproved multimedia BEFORE build
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "ebd3aa444352952321e0108b335722fe26d35716"
          node highfly/scripts/pages_prepare.mjs upstream highfly/config/pages_v0454_media_allowlist.json

      - name: Prepare Node and package manager
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned upstream dependencies
        run: |
          npm install -g pnpm@10.34.5
          cd upstream
          pnpm install --frozen-lockfile
        env:
          CI: 'true'

      - name: Generate original localizations, wiki, and static media manifest
        working-directory: upstream
        run: |
          pnpm run i18n:gen
          pnpm run wiki:content
          node scripts/build_bundle_pregen.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=5120
          VITE_HIGHFLY_PAGES_OFFLINE: '1'

      - name: Compile original renderer/editor/offline game for the GitHub Pages subpath
        working-directory: upstream
        run: |
          pnpm exec vite build --base=/HIGHFLY-FULL-WORLD-LAB/
          node scripts/build_media_manifest.mjs emit
        env:
          NODE_OPTIONS: --max-old-space-size=5120
          VITE_HIGHFLY_PAGES_OFFLINE: '1'
          CI: 'true'

      - name: FINAL RIGHTS GATE — reject anything except 16 pinned CC0 model/texture blobs
        run: |
          node highfly/scripts/pages_finalize.mjs upstream highfly/config/pages_v0454_media_allowlist.json
          du -sh upstream/dist
          find upstream/dist -type f | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload legal static build as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/dist

  deploy:
    name: Publish FULL MIT engine trial with incomplete CC0 visuals
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified static files
        id: deploy
        uses: actions/deploy-pages@v4
