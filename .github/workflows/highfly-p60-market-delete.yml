name: HIGHFLY P60 market and delete key tests
on:
  push:
    branches: [highfly-origin-commercial-p0]
    paths:
      - scripts/highfly_p60_delete_market_audit.py
      - tests/test_highfly_p60_delete_market_audit.py
      - .github/workflows/highfly-p60-market-delete.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/highfly_p60_delete_market_audit.py
      - run: python -m unittest discover -s tests -p 'test_highfly_p60_delete_market_audit.py' -v
