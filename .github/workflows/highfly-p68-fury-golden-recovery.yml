name: HIGHFLY P68 FURY GOLDEN Recovery
on:
  push:
    branches: [highfly-origin-commercial-p0]
    paths:
      - scripts/highfly_p68_fury_golden_recovery.py
      - tests/test_highfly_p68_fury_golden_recovery.py
      - .github/workflows/highfly-p68-fury-golden-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fury-golden-native-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/highfly_p68_fury_golden_recovery.py
      - run: python -m unittest discover -s tests -p 'test_highfly_p68_fury_golden_recovery.py' -v
