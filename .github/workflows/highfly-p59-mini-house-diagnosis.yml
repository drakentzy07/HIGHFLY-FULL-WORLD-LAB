name: HIGHFLY P59 mini house diagnosis tests
on:
  push:
    branches: [highfly-origin-commercial-p0]
    paths:
      - scripts/highfly_p59_minihouse_trace.py
      - tests/test_highfly_p59_minihouse_trace.py
      - .github/workflows/highfly-p59-mini-house-diagnosis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/highfly_p59_minihouse_trace.py
      - run: python -m unittest discover -s tests -p 'test_highfly_p59_minihouse_trace.py' -v
