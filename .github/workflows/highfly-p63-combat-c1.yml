name: HIGHFLY P63 Combat C1
on:
  push:
    branches: [highfly-origin-commercial-p0]
    paths:
      - scripts/highfly_p63_combat_c1.py
      - tests/test_highfly_p63_combat_c1.py
      - .github/workflows/highfly-p63-combat-c1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/highfly_p63_combat_c1.py
      - run: python -m unittest discover -s tests -p 'test_highfly_p63_combat_c1.py' -v
